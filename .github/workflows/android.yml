name: Android debug build
on:
  push:
    branches: [main] # Feature branches build on pull_request; avoid duplicate cancellation/restarts.
  workflow_dispatch:
  pull_request:
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            profile: pixel_2
          - api: 31
            profile: Nexus S # 480x800, 240 dpi: Kompakt-sized AOSP 12 viewport
          - api: 35
            profile: pixel_2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check enrollment protocol design model (not Android activation)
        run: python3 scripts/test_enrollment_protocol.py
      - name: Assemble debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: otp-pager-debug-apk-api-${{ matrix.api }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build unsigned review APK for private development signing
        if: matrix.api == 31
        env:
          REVIEW_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gradle --no-daemon :app:assembleRelease
          python3 scripts/prepare_review_apk.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.api == 31
        with:
          name: otp-pager-unsigned-review-apk
          path: app/build/unsigned-review/
          if-no-files-found: error

      - name: Enable KVM for Android storage verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Keystore, atomic storage and offline queue on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 2048M
          heap-size: 256M
          # Upstream v2 writes unrecognized hw.heapSize; see ReactiveCircus/android-emulator-runner#480.
          # Set the real AVD property before boot; do not change the app's heap policy.
          pre-emulator-launch-script: |
            sed -i '/^hw.heapSize=/d; /^vm.heapSize=/d' "$ANDROID_AVD_HOME/test.avd/config.ini"
            printf '\nvm.heapSize=256\n' >> "$ANDROID_AVD_HOME/test.avd/config.ini"
          disable-animations: true
          script: |
            bash -c 'gradle --no-daemon :app:connectedDebugAndroidTest; otp_tests=$?; adb pull /sdcard/Download/otp-pager-preview app/build/screenshots; otp_capture=$?; if [ "$otp_tests" -ne 0 ]; then exit "$otp_tests"; fi; exit "$otp_capture"'
            python3 scripts/verify_retirement_restart.py
            python3 scripts/verify_global_retirement_restart.py
            python3 scripts/verify_lifecycle_evidence_restart.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/reports/lint-results-debug.html
            app/build/screenshots/
            app/build/global-recovery-screenshots/
