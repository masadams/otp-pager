services:
  relay:
    image: ${RELAY_IMAGE:-otp-pager-relay:local}
    build: ./relay
    restart: unless-stopped
    init: true
    environment:
      RELAY_TOKEN: ${RELAY_TOKEN:?Set a random relay access token}
      DATA_DIR: /data
      # Set to 1 once every chat shows "Private chat": the setup token then only creates claims.
      RELAY_STRICT_CLAIMS: ${RELAY_STRICT_CLAIMS:-0}
    ports:
      - "${RELAY_BIND_IP:-127.0.0.1}:${RELAY_PORT:-8080}:8080"
    volumes:
      - relay-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
volumes:
  relay-data:
