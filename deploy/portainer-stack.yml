# Portainer Git deployment; see docs/DEPLOYMENT.md. Docker Standalone stack.
services:
  relay:
    image: ${RELAY_IMAGE:-ghcr.io/masadams/otp-pager-relay@sha256:7e90cc527e1150e448b70c36bac1bb33ce4f7131a56dd4d367fda2480df85c51}
    restart: unless-stopped
    init: true
    environment:
      RELAY_TOKEN: ${RELAY_TOKEN:?Set a random relay access token}
      DATA_DIR: /data
      # Set to 1 once every chat shows "Private chat": the setup token then only creates claims.
      RELAY_STRICT_CLAIMS: ${RELAY_STRICT_CLAIMS:-0}
    expose:
      - '8080'
    volumes:
      - relay-data:/data
    networks:
      proxy:
        aliases: [otp-pager-relay]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
volumes:
  relay-data:
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
